# ============================================================================
# AgentTeams: DSGS-команды из карточек .dsh/agents/*.md
#
# Сгенерировано: node tools/gen-agent-teams-profiles.mjs
# Не правь руками — правь карточки и перегенерируй.
#
# Куда вставлять: ~/.dsh/profiles/<profile>/cordis.patch.yml
#   (машинный файл, поэтому скрипт его не трогает). Строка agent-teams уже есть
#   в бандле плагина; этот блок её переопределяет. Запуск:
#     /agent-teams --profile dsgs-qa <задача>
# ============================================================================
- id: agent-teams
  name: "@nanmicoder/dsh-agent-teams"
  config:
    stateDir: .agent-teams
    memberProvider: spawn
    maxMembers: 64
    # 0 = члены команды не могут нанимать своих субагентов; DSGS-иерархия
    # (специалист -> лид) требует 1. Осознанно: 1 открывает и вложенные команды.
    memberMaxDepth: 1
    toolPolicies:
      code:
        allow: [read, glob, grep, write, edit, pwsh]
      code-research:
        allow: [read, glob, grep, write, edit, pwsh, web_search]
      design:
        allow: [read, glob, grep, write, edit]
      design-research:
        allow: [read, glob, grep, write, edit, web_search]
      research:
        allow: [read, glob, grep, web_search]
    profiles:
      dsgs-direction:
        description: Режиссура и продюсирование — Стратегия проекта, приоритеты, арбитраж между отделами.
        protocol: Сначала план и вопросы капитану, потом работа. Файлы менять только в своей области и только с одобрения пользователя. Ничего не коммитить и не деплоить. Отвечать по-русски, если пользователь пишет по-русски.
        taskPlanning: captain
        members:
          - name: studio-director
            role: "Лелуш · Studio direction and coordination"
            tool_policy: research
            executionPrompt: "Ты — Лелуш, Босс (карточка studio-director). Называй себя этим именем в отчётах и в переписке с капитаном. Первым делом прочитай C:/Users/Igor/.dsh/dsgs/.dsh/agents/studio-director.md целиком и работай строго по этой роли: границы отдела, протокол согласования, формат вывода. Карточка — источник правды, не переписывай её. Не меняй файлы вне своей области; спорные вопросы и блокеры возвращай капитану, сам за пользователя не решай."
